  /* Parts */

  .toc-part {

  }

  .toc-part > summary {

    align-items: center;

    padding: 30px 0;
    cursor: pointer;
    list-style: none;

  }

  }

  .toc-part-title {

  }

    display: grid;

  .toc-group[open] > summary .toc-group-mark {

    background: var(--navy);
    color: var(--white) !important;
  }

  .toc-chapters {
    padding-bottom: 20px;
  }

  /* Chapters */

  .toc-chapter {

    padding-left: 18px;
  }

    grid-template-columns: 45px 1fr 30px;

    align-items: center;
    padding: 25px 0;
    cursor: pointer;
    list-style: none;

  .toc-title {

    margin: 0 0 25px 64px;
    color: var(--ink) !important;

/* =========================================================
   HELPERS
   ========================================================= */

const toc = document.getElementById("toc");

function escapeHTML(value) {
  const div = document.createElement("div");
  div.textContent = value;
  return div.innerHTML;
}

function slug(value) {
  return value
    .toLowerCase()
    .replace(/[’']/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}


/* =========================================================
   RENDER A GROUP AT ANY DEPTH
   ========================================================= */

function renderGroup(group, repo) {

  const details = document.createElement("details");
  details.className = "toc-group";

  const summary = document.createElement("summary");

  summary.innerHTML =
    "<span>" +
    escapeHTML(group.title) +
    "</span>" +
    '<span class="toc-group-mark">+</span>';

  details.appendChild(summary);

  const body = document.createElement("div");
  body.className = "toc-group-body";

  group.children.forEach(item => {

    /* Nested group */

    if (
      typeof item === "object" &&
      item !== null &&
      Array.isArray(item.children)
    ) {

      body.appendChild(
        renderGroup(item, repo)
      );

    }

    /* Leaf topic */

    else {

      const link = document.createElement("a");

      link.className = "toc-leaf";

      link.href =
        "https://propropro25.github.io/" +
        repo +
        "/#" +
        slug(item);

      link.textContent = item;

      body.appendChild(link);
    }

  });

  details.appendChild(body);

  return details;
}


/* =========================================================
   RENDER CHAPTER
   ========================================================= */

function renderChapter(chapter) {

  const details = document.createElement("details");

  details.className = "toc-chapter";

  const summary = document.createElement("summary");

  summary.innerHTML =
    '<span class="toc-no">' +
    escapeHTML(chapter.number) +
    "</span>" +

    '<span class="toc-title">' +
    escapeHTML(chapter.title) +
    "</span>" +

    '<span class="toc-chapter-mark">+</span>';

  details.appendChild(summary);


  const openLink = document.createElement("a");

  openLink.className = "toc-open";

  openLink.href =
    "https://propropro25.github.io/" +
    chapter.repo +
    "/";

  openLink.textContent = "Open chapter →";

  details.appendChild(openLink);


  const groups = document.createDocumentFragment();

  chapter.groups.forEach(group => {

    groups.appendChild(
      renderGroup(group, chapter.repo)
    );

  });

  details.appendChild(groups);

  return details;
}


/* =========================================================
   RENDER PARTS
   ========================================================= */

  )
];

partNames.forEach(partName => {

  const part = document.createElement("details");

  const summary = document.createElement("summary");

  const displayName =
    partName.includes(" — ")
      ? partName.split(" — ")[1]
      : partName;

  summary.innerHTML =
    '<span class="toc-part-title">' +
    escapeHTML(displayName) +
    "</span>" +

    '<span class="toc-part-mark">+</span>';

  part.appendChild(summary);


  const chapterContainer =
    document.createElement("div");

  chapterContainer.className =
    "toc-chapters";


  chapters
    .filter(chapter => chapter.part === partName)
    .forEach(chapter => {

      chapterContainer.appendChild(
        renderChapter(chapter)
      );

    });


  part.appendChild(chapterContainer);

  toc.appendChild(part);
