const toc=document.getElementById('toc');
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const slug=s=>s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function leaves(items,arr=[]){items.forEach(x=>x.children?leaves(x.children,arr):arr.push(x.title));return arr}
function renderGroups(groups,repo,cls='toc-group'){
 const frag=document.createDocumentFragment();
 groups.forEach(g=>{
  const d=document.createElement('details');d.className=cls;
  const s=document.createElement('summary');s.innerHTML='<span>'+esc(g.title)+'</span><span class="toc-group-mark">+</span>';d.appendChild(s);
  const body=document.createElement('div');body.className='toc-group-body';
  g.children.forEach(x=>{
   if(x.children){
    const sub=document.createElement('details');sub.className='toc-group';
    const ss=document.createElement('summary');ss.innerHTML='<span>'+esc(x.title)+'</span><span class="toc-group-mark">+</span>';sub.appendChild(ss);
    const sb=document.createElement('div');sb.className='toc-group-body';
    x.children.forEach(y=>{const a=document.createElement('a');a.className='toc-leaf';a.href='https://propropro25.github.io/'+repo+'/#'+slug(y.title);a.textContent=y.title;sb.appendChild(a)});

   }else{
    const a=document.createElement('a');a.className='toc-leaf';a.href='https://propropro25.github.io/'+repo+'/#'+slug(x.title);a.textContent=x.title;body.appendChild(a);
   }
  });
  d.appendChild(body);frag.appendChild(d);
 });
 return frag;
}
